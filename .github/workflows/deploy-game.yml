name: Deploy Biome World

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-game.yml'
      - 'mp.js'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build game with multiplayer
        run: |
          set -eux
          curl -fsSL -o index.html "https://raw.githubusercontent.com/t17067042-code/biome-world-tg/2adb892ce928e2cba47d134e437e369e465b27b6/index.html"
          python3 << 'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          mp = Path('mp.js').read_text(encoding='utf-8')
          if 'peerjs@1.5.4' not in html:
              html = html.replace('</head>', '<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>\n</head>', 1)
          if '__MP_LOADED' not in html:
              html = html.replace('</body>', '<script>\n' + mp + '\n</script>\n</body>', 1)
          html = html.replace('function enemyWorkerManagerApply(){', 'function enemyWorkerManagerApply(){ if(window.MP&&window.MP.on) return;', 1)
          html = html.replace('function enemyBuildManager(dt){', 'function enemyBuildManager(dt){ if(window.MP&&window.MP.on) return;', 1)
          html = html.replace('function enemyTerritoryTick(dt){', 'function enemyTerritoryTick(dt){ if(window.MP&&window.MP.on) return;', 1)
          html = html.replace('function enemyRetarget(){', 'function enemyRetarget(){ if(window.MP&&window.MP.on) return false;', 1)
          html = html.replace('x.putImageData(wimg,0,0);\nfunction resize()', 'x.putImageData(wimg,0,0);\n}\nfunction resize()')
          html = html.replace('}\n}\nfunction resize()', '}\nfunction resize()')
          Path('index.html').write_text(html, encoding='utf-8')
          print('ok', len(html), 'MP', '__MP_LOADED' in html)
          PY
          touch .nojekyll
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const ms=[...h.matchAll(/<script[^>]*>([\\s\\S]*?)<\\/script>/g)].map(x=>x[1]);for(const m of ms){if(m.length>100) new Function(m);} console.log('syntax ok', ms.length);"

      - name: Commit
        run: |
          git config user.name biome-bot
          git config user.email biome@users.noreply.github.com
          git add index.html .nojekyll mp.js
          git diff --cached --quiet || (git commit -m "2P multiplayer module inlined" && git push origin HEAD:main)

      - name: Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
          enable_jekyll: false
