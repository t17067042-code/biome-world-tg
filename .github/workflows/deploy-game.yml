name: Deploy Biome World

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-game.yml'
      - 'scripts/patch_audio.py'

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download audio-fixed game
        run: |
          mkdir -p publish
          curl -fsSL -o /tmp/game.zip "https://tmpfiles.org/dl/1787583189.6f225543e58914df/wuw22kO33Ams/game_audio_fixed.zip"
          unzip -o /tmp/game.zip -d /tmp/game_extract
          cp /tmp/game_extract/game_audio_fixed.html publish/index.html
          ls -la publish/
          wc -c publish/index.html
          grep -c 'playChop\|startBackgroundMusic\|bg-music' publish/index.html || true
      - name: Ensure music file
        run: |
          if [ ! -s publish/bg-music.mp3 ]; then
            if [ -s bg-music.mp3 ]; then cp bg-music.mp3 publish/bg-music.mp3
            else curl -fsSL -o publish/bg-music.mp3 https://cdn.jsdelivr.net/gh/t17067042-code/biome-world-tg@main/bg-music.mp3 || true
            fi
          fi
          touch publish/.nojekyll
          ls -la publish/
      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish
          force_orphan: true
          enable_jekyll: false
