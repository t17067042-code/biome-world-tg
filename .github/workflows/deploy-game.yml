name: Deploy Biome World

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-game.yml'
      - 'scripts/**'
      - 'publish/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build
        run: |
          mkdir -p publish
          curl -fsSL -o /tmp/game.zip "https://tmpfiles.org/dl/1787666524.28d5b6465a99d779/wcwBGZfB6WmI/game_bugs.zip"
          unzip -o /tmp/game.zip -d /tmp/game_extract
          HTML=$(find /tmp/game_extract -name '*.html' | head -1)
          cp "$HTML" publish/index.html
          if [ -s bg-music.mp3 ]; then cp bg-music.mp3 publish/bg-music.mp3
          else curl -fsSL -o publish/bg-music.mp3 "https://raw.githubusercontent.com/t17067042-code/biome-world-tg/main/bg-music.mp3" || true
          fi
          touch publish/.nojekyll
          ls -la publish/
          wc -c publish/index.html
          grep -c 'manualMove\|isPeasantWorker\|__enemyBuildSeen\|VS ИИ' publish/index.html || true

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish
          force_orphan: true
          enable_jekyll: false
