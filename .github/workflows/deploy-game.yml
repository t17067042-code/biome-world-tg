name: Deploy Biome World

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-game.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download game HTML
        run: |
          set -e
          curl -fsSL --retry 5 -o index.html "https://litter.catbox.moe/k233i0.html"
          test -s index.html
          wc -c index.html
          grep -q 'Biome World' index.html
          touch .nojekyll

      - name: Commit to main
        run: |
          git config user.name "biome-deploy-bot"
          git config user.email "biome-deploy@users.noreply.github.com"
          git add index.html .nojekyll
          if git diff --cached --quiet; then
            echo "No content changes"
          else
            git commit -m "Add Biome World game HTML"
            git push origin HEAD:main
          fi

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
          enable_jekyll: false
