name: Deploy Biome World

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-game.yml'
      - 'mp_parts/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble multiplayer game from parts
        run: |
          set -eux
          if [ -d mp_parts ]; then
            cat mp_parts/part*.b64 | base64 -d | gzip -dc > index.html
            wc -c index.html
            grep -q 'window.MP' index.html
            grep -q 'peerjs' index.html
            node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=[...h.matchAll(/<script[^>]*>([\\s\\S]*?)<\\/script>/g)].map(x=>x[1]).filter(s=>s.includes('function update')).sort((a,b)=>b.length-a.length)[0]; new Function(m); console.log('syntax ok');"
          else
            echo "no parts"
            exit 1
          fi
          touch .nojekyll

      - name: Commit
        run: |
          git config user.name biome-bot
          git config user.email biome@users.noreply.github.com
          git add index.html .nojekyll
          git diff --cached --quiet || (git commit -m "Multiplayer 2P: PeerJS host/guest, no enemy AI" && git push origin HEAD:main)

      - name: Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
          enable_jekyll: false
