name: Deploy Biome World

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-game.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and fix index.html
        run: |
          set -eux
          curl -fsSL -o index.html "https://raw.githubusercontent.com/t17067042-code/biome-world-tg/main/index.html"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          print('before', len(html))

          # Fix missing } after water overlay body (infinite loading root cause)
          patterns = [
            ('x.putImageData(wimg,0,0);\nfunction resize()', 'x.putImageData(wimg,0,0);\n}\nfunction resize()'),
            ('putImageData(wimg,0,0);\nfunction resize()', 'putImageData(wimg,0,0);\n}\nfunction resize()'),
          ]
          changed = False
          for a,b in patterns:
            if a in html and b not in html.replace(a,b,1):
              pass
            if a in html:
              # only if not already closed
              idx = html.find(a)
              # if already has } before function, skip
              if idx != -1:
                  html = html.replace(a, b, 1)
                  changed = True
                  print('applied pattern')
                  break

          if not changed:
              html2, n = re.subn(
                  r'(putImageData\(wimg,0,0\);)\s*\n(?!\})\s*(function resize\()',
                  r'\1\n}\n\2',
                  html,
                  count=1,
              )
              if n:
                  html = html2
                  changed = True
                  print('applied regex')

          # Avoid double-close
          html = html.replace('}\n}\nfunction resize()', '}\nfunction resize()')

          scripts = re.findall(r'<script[^>]*>([\s\S]*?)</script>', html)
          main = max(scripts, key=len)
          depth = 0
          for ch in main:
              if ch == '{': depth += 1
              elif ch == '}': depth -= 1
          print('depth', depth, 'changed', changed)
          if depth != 0:
              # last resort: append missing braces at end of main script
              if depth > 0:
                  html = html.replace('requestAnimationFrame(loop);\n});\n</script>', 'requestAnimationFrame(loop);\n});\n' + ('}'*depth) + '\n</script>', 1)
                  print('appended', depth, 'braces')
              else:
                  raise SystemExit('too many closes')

          p.write_text(html, encoding='utf-8')
          print('after', len(html))
          PY
          touch .nojekyll
          # verify node syntax if available
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=[...h.matchAll(/<script[^>]*>([\\s\\S]*?)<\\/script>/g)].map(x=>x[1]).sort((a,b)=>b.length-a.length)[0];new Function(m);console.log('syntax ok')"

      - name: Commit
        run: |
          git config user.name biome-bot
          git config user.email biome@users.noreply.github.com
          git add index.html .nojekyll
          git status
          git diff --cached --stat
          git diff --cached --quiet || (git commit -m "Fix infinite loading missing brace" && git push origin HEAD:main)

      - name: Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
          enable_jekyll: false
