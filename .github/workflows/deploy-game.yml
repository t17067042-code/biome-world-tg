name: Deploy Biome World

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-game.yml'
      - 'publish/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch game + music
        run: |
          set -eux
          mkdir -p publish
          if [ -f publish/index.html ] && [ -s publish/index.html ]; then
            echo "using committed publish/index.html"
          else
            curl -fsSL -o publish/index.html "https://cdn.jsdelivr.net/gh/t17067042-code/biome-world-tg@gh-pages/index.html" \
              || curl -fsSL -o publish/index.html "https://litter.catbox.moe/f0dr1f.html"
          fi
          if [ -f publish/bg-music.mp3 ] && [ -s publish/bg-music.mp3 ]; then
            echo "using committed music"
          else
            curl -fsSL -o publish/bg-music.mp3 "https://cdn.jsdelivr.net/gh/t17067042-code/biome-world-tg@main/bg-music.mp3" \
              || curl -fsSL -o publish/bg-music.mp3 "https://litter.catbox.moe/u4yp6k.mp3"
          fi
          python3 << 'PY'
          from pathlib import Path
          import re
          MUSIC = 'https://cdn.jsdelivr.net/gh/t17067042-code/biome-world-tg@gh-pages/bg-music.mp3'
          p = Path('publish/index.html')
          h = p.read_text(encoding='utf-8', errors='replace')
          h = re.sub(
              r'<audio[^>]*id="bgMusic"[^>]*>[\s\S]*?</audio>',
              f'<audio id="bgMusic" preload="auto" loop playsinline>\n<source src="{MUSIC}" type="audio/mpeg">\n<source src="bg-music.mp3" type="audio/mpeg">\n</audio>',
              h, count=1
          )
          h = h.replace('https://litter.catbox.moe/u4yp6k.mp3', MUSIC)
          h = re.sub(r"const SRC = [^;]+;", f"const SRC = '{MUSIC}';", h)
          h = h.replace("bgMusic.src=new URL('bg-music.mp3', location.href).href", f"bgMusic.src='{MUSIC}'")
          h = h.replace("bgMusic.src='bg-music.mp3'", f"bgMusic.src='{MUSIC}'")
          h = h.replace('function startBackgroundMusic(){\n  if(!gameAudioCtx', 'function startBackgroundMusic_SYNTH_OFF(){\n  if(!gameAudioCtx')
          Path('publish/.nojekyll').write_text('')
          p.write_text(h, encoding='utf-8')
          print('index', p.stat().st_size, 'music', Path('publish/bg-music.mp3').stat().st_size)
          print('music url', MUSIC in h)
          PY
          cp publish/index.html index.html
          cp publish/bg-music.mp3 bg-music.mp3 || true
          cp publish/.nojekyll .nojekyll

      - name: Commit snapshot
        run: |
          git config user.name biome-bot
          git config user.email biome@users.noreply.github.com
          git add index.html bg-music.mp3 .nojekyll publish/ || true
          git diff --cached --quiet || git commit -m "Publish game+music snapshot"
          git push origin HEAD:main || true

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish
          force_orphan: true
          enable_jekyll: false

      - name: Enable GitHub Pages site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # Create Pages site from gh-pages branch
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/t17067042-code/biome-world-tg/pages \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          echo
          # Or update existing
          curl -sS -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/t17067042-code/biome-world-tg/pages \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          echo
          curl -sS -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/t17067042-code/biome-world-tg/pages || true
          echo
