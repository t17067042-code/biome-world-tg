name: Deploy Biome World

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-game.yml'
      - 'mp.js'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build fixed game
        run: |
          set -eux
          curl -fsSL -o index.html "https://raw.githubusercontent.com/t17067042-code/biome-world-tg/main/index.html"
          python3 << 'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          mp = Path('mp.js').read_text(encoding='utf-8') if Path('mp.js').exists() else ''

          # Remove unused PeerJS (memory + hang risk in TG WebView)
          html = re.sub(r'\s*<script src="https://unpkg\.com/peerjs[^"]*"></script>\s*', '\n', html)

          # Mobile DPR cap
          html = html.replace('Math.min(devicePixelRatio,1.5)', 'Math.min(devicePixelRatio||1,(navigator.maxTouchPoints>0?1.15:1.35))', 1)

          # Fatal error overlay
          if 'id="fatalError"' not in html:
              ov = '''\n<div id="fatalError" style="display:none;position:fixed;inset:0;z-index:99999;background:#1a0a0a;color:#ffb4b4;padding:20px;font:14px/1.45 system-ui;overflow:auto"><b style="color:#fff">Ошибка игры</b><pre id="fatalErrorText" style="white-space:pre-wrap;margin-top:12px"></pre><button onclick="location.reload()" style="margin-top:16px;padding:10px 16px;border-radius:10px;border:0;background:#4b9cff;color:#fff;font-weight:700">Перезагрузить</button></div>\n<script>window.__showFatal=function(m){try{var e=document.getElementById('fatalError'),t=document.getElementById('fatalErrorText');if(t)t.textContent=String(m);if(e)e.style.display='block'}catch(x){}};window.addEventListener('error',function(e){window.__showFatal((e&&e.message||'error')+'\\n'+(e&&e.filename||'')+':'+(e&&e.lineno||''))});window.addEventListener('unhandledrejection',function(e){var r=e&&e.reason;window.__showFatal('Promise: '+(r&&r.message?r.message:r))});</script>\n'''
              html = html.replace('<body>', '<body>'+ov, 1)

          # Safer boot loop start
          html = html.replace(
              "document.getElementById('loading').classList.add('hidden');\n  requestAnimationFrame(loop);",
              "document.getElementById('loading').classList.add('hidden');\n  requestAnimationFrame(function(){try{loop();}catch(err){if(window.__showFatal)__showFatal(err&&err.stack||err);}});",
              1)

          # Hard off enemy military
          html2, n = re.subn(
              r'function updateRTSUnits\(dt\)\{[\s\S]*?checkBaseHpInit\(\);\s*\}',
              'function updateRTSUnits(dt){\n  if(gameOverState) return;\n  updateMilitaryList(rtsUnits,dt);\n  if(typeof enemyRtsUnits!=="undefined"){for(const u of enemyRtsUnits){u.hp=0;u.job="dead";}enemyRtsUnits.length=0;}\n  checkBaseHpInit();\n}',
              html, count=1)
          if n: html = html2
          html = html.replace('drawList(enemyRtsUnits);', '/*no enemy draw*/', 1)
          html = html.replace('updateMilitaryList(enemyRtsUnits,dt);', '/*no enemy*/', 1)
          html = html.replace('updateEnemyArmyAI(dt);', '/*no army*/', 1)

          # Inline latest mp.js (itty.ws)
          if mp:
              if '/* Biome World 2P' in html:
                  s = html.find('/* Biome World 2P')
                  a = html.rfind('<script>', 0, s)
                  b = html.find('</script>', s)
                  if a>=0 and b>a:
                      html = html[:a] + '<script>\n' + mp + '\n</script>' + html[b+9:]
              elif '__MP_LOADED' not in html:
                  html = html.replace('</body>', '<script>\n'+mp+'\n</script>\n</body>', 1)

          html = html.replace('x.putImageData(wimg,0,0);\nfunction resize()', 'x.putImageData(wimg,0,0);\n}\nfunction resize()')
          html = html.replace('}\n}\nfunction resize()', '}\nfunction resize()')

          for sc in re.findall(r'<script[^>]*>([\s\S]*?)</script>', html):
              if len(sc)>100 and sc.count('{')!=sc.count('}'):
                  raise SystemExit('brace imbalance')
          Path('index.html').write_text(html, encoding='utf-8')
          print('ok', len(html), 'peerjs', 'peerjs' in html, 'fatal', 'fatalError' in html, 'itty', 'itty.ws' in html)
          PY
          touch .nojekyll
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');[...h.matchAll(/<script[^>]*>([\\s\\S]*?)<\\/script>/g)].forEach(m=>{if(m[1].length>100) new Function(m[1]);});console.log('syntax ok');"

      - name: Commit
        run: |
          git config user.name biome-bot
          git config user.email biome@users.noreply.github.com
          git add index.html .nojekyll
          git diff --cached --quiet || (git commit -m "Crash fixes for Telegram WebView" && git push origin HEAD:main)

      - name: Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
          enable_jekyll: false
