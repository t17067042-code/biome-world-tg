name: Deploy Biome World

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-game.yml'

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download game HTML
        run: |
          set -e
          curl -fsSL --retry 5 -o index.html "https://litter.catbox.moe/k233i0.html"
          test -s index.html
          wc -c index.html
          grep -q 'Biome World' index.html
          touch .nojekyll

      - name: Commit to main
        run: |
          git config user.name "biome-deploy-bot"
          git config user.email "biome-deploy@users.noreply.github.com"
          git add index.html .nojekyll
          if git diff --cached --quiet; then
            echo "No content changes"
          else
            git commit -m "Add Biome World game HTML"
            git push origin HEAD:main
          fi

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
          enable_jekyll: false

      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # Create pages site from gh-pages branch (ignore if already exists)
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/t17067042-code/biome-world-tg/pages \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          echo
          # Or update existing
          curl -sS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/t17067042-code/biome-world-tg/pages \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          echo
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/t17067042-code/biome-world-tg/pages || true
          echo
