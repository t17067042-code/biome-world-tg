name: Deploy Biome World

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-game.yml'
      - 'scripts/patch_audio.py'

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch audio
        run: python3 scripts/patch_audio.py
      - name: Ensure music file
        run: |
          if [ ! -s publish/bg-music.mp3 ]; then
            curl -fsSL -o publish/bg-music.mp3 https://cdn.jsdelivr.net/gh/t17067042-code/biome-world-tg@main/bg-music.mp3 || true
          fi
          ls -la publish/
      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish
          force_orphan: true
          enable_jekyll: false
