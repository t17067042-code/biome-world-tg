name: Deploy Biome World

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-game.yml'
      - 'publish/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch game + music
        run: |
          set -eux
          mkdir -p publish
          if [ -f publish/index.html ] && [ -s publish/index.html ]; then
            echo "using committed publish/index.html"
          else
            curl -fsSL -o publish/index.html "https://litter.catbox.moe/f0dr1f.html"
          fi
          if [ -f publish/bg-music.mp3 ] && [ -s publish/bg-music.mp3 ]; then
            echo "using committed music"
          else
            curl -fsSL -o publish/bg-music.mp3 "https://litter.catbox.moe/u4yp6k.mp3"
          fi
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path('publish/index.html')
          h = p.read_text(encoding='utf-8', errors='replace')
          h = re.sub(
              r'<audio[^>]*id="bgMusic"[^>]*>[\s\S]*?</audio>',
              '<audio id="bgMusic" preload="auto" loop playsinline>\n<source src="bg-music.mp3" type="audio/mpeg">\n</audio>',
              h, count=1
          )
          h = h.replace("https://litter.catbox.moe/u4yp6k.mp3", "bg-music.mp3")
          h = h.replace("bgMusic.src='bg-music.mp3'", "bgMusic.src=new URL('bg-music.mp3', location.href).href")
          if 'const SRC' in h:
              h = re.sub(r"const SRC = [^;]+;", "const SRC = new URL('bg-music.mp3', location.href).href;", h)
          h = h.replace('function startBackgroundMusic(){\n  if(!gameAudioCtx', 'function startBackgroundMusic_SYNTH_OFF(){\n  if(!gameAudioCtx')
          Path('publish/.nojekyll').write_text('')
          p.write_text(h, encoding='utf-8')
          print('index', p.stat().st_size, 'music', Path('publish/bg-music.mp3').stat().st_size)
          print('has bg-music', 'bg-music.mp3' in h)
          print('has synth', 'bass=[65.41' in h)
          PY
          cp publish/index.html index.html
          cp publish/bg-music.mp3 bg-music.mp3
          cp publish/.nojekyll .nojekyll

      - name: Commit snapshot to main
        run: |
          git config user.name biome-bot
          git config user.email biome@users.noreply.github.com
          git add index.html bg-music.mp3 .nojekyll publish/index.html publish/bg-music.mp3 publish/.nojekyll || true
          git diff --cached --quiet || git commit -m "Publish game with mirostar music"
          git push origin HEAD:main || true

      - name: GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish
          force_orphan: true
          enable_jekyll: false
