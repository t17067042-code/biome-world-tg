name: Deploy Biome World

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-game.yml'
      - 'mp.js'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build fixed game
        run: |
          set -eux
          curl -fsSL -o index.html "https://raw.githubusercontent.com/t17067042-code/biome-world-tg/main/index.html"
          python3 << 'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          mp = Path('mp.js').read_text(encoding='utf-8') if Path('mp.js').exists() else ''

          # Hard replace updateRTSUnits body start
          html2, n = re.subn(
              r'function updateRTSUnits\(dt\)\{\s*if\(gameOverState\) return;\s*updateMilitaryList\(rtsUnits,dt\);[\s\S]*?checkBaseHpInit\(\);\s*\}',
              '''function updateRTSUnits(dt){\n  if(gameOverState) return;\n  updateMilitaryList(rtsUnits,dt);\n  // HARD OFF enemy military (walked on water, griefed base, unfightable)\n  if(typeof enemyRtsUnits!=="undefined"){\n    for(const u of enemyRtsUnits){u.hp=0;u.job="dead";}\n    enemyRtsUnits.length=0;\n  }\n  checkBaseHpInit();\n}''',
              html, count=1)
          if n:
              html = html2
              print('updateRTSUnits replaced', n)
          else:
              print('WARN updateRTSUnits not matched')

          html = html.replace('drawList(enemyRtsUnits);', '/* no enemy draw */', 1)
          html = html.replace('updateMilitaryList(enemyRtsUnits,dt);', '/* no enemy military */', 1)
          html = html.replace('updateEnemyArmyAI(dt);', '/* no enemy army */', 1)

          # water clamp if missing
          if 'tileWalkable' not in html:
              i = html.find('function moveUnitToward')
              if i > 0:
                  j = html.find('\nfunction ', i+10)
                  html = html[:i] + '''function moveUnitToward(u,tx,ty,dt){\n  const dx=tx-u.x, dy=ty-u.y, dist=Math.hypot(dx,dy);\n  if(dist<4){u.x=tx;u.y=ty;return true}\n  const step=u.speed*dt;\n  const nx=u.x+dx/dist*Math.min(step,dist);\n  const ny=u.y+dy/dist*Math.min(step,dist);\n  const tileWalkable=(x,y)=>{\n    const tx0=Math.floor(x/TILE), ty0=Math.floor(y/TILE);\n    if(tx0<0||ty0<0||tx0>=MAP_W||ty0>=MAP_H) return false;\n    if(biomeMap[ty0]&&biomeMap[ty0][tx0]===B.WATER) return false;\n    return true;\n  };\n  if(tileWalkable(nx,ny)){ u.x=nx; u.y=ny; }\n  else if(tileWalkable(nx,u.y)) u.x=nx;\n  else if(tileWalkable(u.x,ny)) u.y=ny;\n  else return true;\n  if(dx) u.facing=dx<0?-1:1;\n  u.x=Math.max(16,Math.min(MAP_W*TILE-16,u.x));\n  u.y=Math.max(16,Math.min(MAP_H*TILE-16,u.y));\n  return Math.hypot(tx-u.x,ty-u.y)<4;\n}\n''' + html[j:]
                  print('water clamp added')

          # Ensure MP
          if 'peerjs@1.5.4' not in html:
              html = html.replace('</head>', '<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>\n</head>', 1)
          if mp:
              if '__MP_LOADED' in html:
                  s = html.find('/* Biome World 2P')
                  if s > 0:
                      a = html.rfind('<script>', 0, s)
                      b = html.find('</script>', s)
                      if a >= 0 and b > a:
                          html = html[:a] + '<script>\n' + mp + '\n</script>' + html[b+9:]
                          print('mp replaced')
              else:
                  html = html.replace('</body>', '<script>\n' + mp + '\n</script>\n</body>', 1)
                  print('mp inlined')

          html = html.replace('x.putImageData(wimg,0,0);\nfunction resize()', 'x.putImageData(wimg,0,0);\n}\nfunction resize()')
          html = html.replace('}\n}\nfunction resize()', '}\nfunction resize()')

          Path('index.html').write_text(html, encoding='utf-8')
          print('ok', len(html))
          assert 'enemyRtsUnits.length=0' in html or 'no enemy military' in html
          PY
          touch .nojekyll
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');[...h.matchAll(/<script[^>]*>([\\s\\S]*?)<\\/script>/g)].forEach(m=>{if(m[1].length>100) new Function(m[1]);});console.log('syntax ok');"

      - name: Commit
        run: |
          git config user.name biome-bot
          git config user.email biome@users.noreply.github.com
          git add index.html .nojekyll
          git diff --cached --quiet || (git commit -m "Hard off enemy RTS units" && git push origin HEAD:main)

      - name: Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
          enable_jekyll: false
