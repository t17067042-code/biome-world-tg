name: Deploy Biome World

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-game.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download game HTML
        run: |
          set -e
          curl -fsSL --retry 5 -o index.html "https://litter.catbox.moe/dqlhrf.html"
          test -s index.html
          grep -q 'MAP_W=200' index.html
          touch .nojekyll
      - name: Commit to main
        run: |
          git config user.name "biome-deploy-bot"
          git config user.email "biome-deploy@users.noreply.github.com"
          git add index.html .nojekyll
          git diff --cached --quiet || (git commit -m "Map 2x 200x150" && git push origin HEAD:main)
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
          enable_jekyll: false
