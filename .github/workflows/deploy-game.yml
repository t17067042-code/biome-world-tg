name: Deploy Biome World

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-game.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix broken JS and keep perf patches
        run: |
          set -e
          curl -fsSL -o index.html "https://raw.githubusercontent.com/t17067042-code/biome-world-tg/main/index.html"
          python3 << 'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')

          # CRITICAL: close buildWaterOverlay before function resize
          fixed = 0
          for a,b in [
            ('x.putImageData(wimg,0,0);\nfunction resize()', 'x.putImageData(wimg,0,0);\n}\nfunction resize()'),
            ('x.putImageData(wimg,0,0);\r\nfunction resize()', 'x.putImageData(wimg,0,0);\n}\nfunction resize()'),
          ]:
            if a in html:
              html = html.replace(a, b, 1)
              fixed += 1
              print('closed water fn')
          if not fixed:
              # broader
              html2, n = re.subn(
                  r'(x\.putImageData\(wimg,0,0\);)\s*(function resize\()',
                  r'\1\n}\n\2',
                  html, count=1)
              if n:
                  html = html2
                  print('closed water via regex')
                  fixed = 1

          # If water still MAP_W*TILE, fix it fully
          if 'waterOverlayCanvas.width=MAP_W*TILE' in html:
              html2, n = re.subn(
                  r"waterOverlayCanvas=document\.createElement\('canvas'\);\s*waterOverlayCanvas\.width=MAP_W\*TILE;[\s\S]*?(?=function resize\()",
                  """waterOverlayCanvas=document.createElement('canvas');
            waterOverlayCanvas.width=MAP_W; waterOverlayCanvas.height=MAP_H;
            const x=waterOverlayCanvas.getContext('2d'); x.imageSmoothingEnabled=false;
            const wimg=x.createImageData(MAP_W,MAP_H);
            for(let ty=0;ty<MAP_H;ty++)for(let tx=0;tx<MAP_W;tx++){
              if(biomeMap[ty][tx]!==B.WATER) continue;
              const i=(ty*MAP_W+tx)*4;
              wimg.data[i]=36; wimg.data[i+1]=88; wimg.data[i+2]=138; wimg.data[i+3]=210;
            }
            x.putImageData(wimg,0,0);
          }
          """,
                  html, count=1)
              if n: html = html2; print('full water rebuild')

          # brace check
          scripts = re.findall(r'<script[^>]*>([\s\S]*?)</script>', html)
          main = max(scripts, key=len)
          depth = 0
          for ch in main:
            if ch=='{': depth+=1
            elif ch=='}': depth-=1
          print('brace depth', depth, 'opens', main.count('{'), 'closes', main.count('}'))
          if depth != 0:
              raise SystemExit(f'brace imbalance depth={depth}')

          Path('index.html').write_text(html, encoding='utf-8')
          print('ok', len(html))
          PY
          touch .nojekyll

      - name: Commit
        run: |
          git config user.name biome-bot
          git config user.email biome@users.noreply.github.com
          git add index.html .nojekyll
          git diff --cached --quiet || (git commit -m "Fix infinite loading: close buildWaterOverlay" && git push origin HEAD:main)

      - name: Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
          enable_jekyll: false
