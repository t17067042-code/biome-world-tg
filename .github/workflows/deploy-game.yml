name: Deploy Biome World

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-game.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download game HTML
        run: |
          set -e
          curl -fsSL -o index.html "https://litter.catbox.moe/k233i0.html"
          # ensure Telegram WebApp script is present
          if ! grep -q 'telegram-web-app.js' index.html; then
            python3 - <<'PY'
from pathlib import Path
p = Path('index.html')
html = p.read_text(encoding='utf-8')
inject = '''<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(function(){
  try {
    var tg = window.Telegram && window.Telegram.WebApp;
    if (!tg) return;
    tg.ready();
    tg.expand();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  } catch (e) {}
})();
</script>
'''
html = html.replace('<title>Biome World</title>', '<title>Biome World</title>\\n' + inject, 1)
p.write_text(html, encoding='utf-8')
PY
          fi
          wc -c index.html
          head -c 200 index.html

      - name: Commit game to main
        run: |
          git config user.name "biome-deploy-bot"
          git config user.email "biome-deploy@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes" || git commit -m "Deploy Biome World game HTML"
          git push origin main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
