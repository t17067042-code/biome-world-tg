<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Biome World</title>
<style>html,body{margin:0;height:100%;background:#0d1117;color:#c9d1d9;font-family:system-ui;display:flex;align-items:center;justify-content:center}#s{opacity:.75}</style>
</head><body><div id="s">Загрузка…</div>
<script>
(async()=>{
  try{
    const base=location.href.replace(/[^/]*$/,'');
    const n=15;
    const parts=await Promise.all(Array.from({length:n},(_,i)=>fetch(base+'g'+String(i).padStart(2,'0')+'.b64',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('g'+i+' '+r.status);return r.text()})));
    const bin=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));
    const ds=new DecompressionStream('gzip');
    const stream=new Blob([bin]).stream().pipeThrough(ds);
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('s').textContent='Ошибка: '+e.message}
})();
</script></body></html>
