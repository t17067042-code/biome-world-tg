<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Biome World</title>
<style>html,body{margin:0;height:100%;background:#0d1117;color:#c9d1d9;font-family:system-ui;display:flex;align-items:center;justify-content:center}#s{opacity:.75}</style>
</head><body><div id="s">Загрузка…</div>
<script>
(async()=>{
  try{
    const base=location.href.replace(/[^/]*$/,'');
    const parts=await Promise.all([1,2,3,4].map(i=>fetch(base+'part'+i+'.txt',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('part'+i+' '+r.status);return r.text()})));
    const html=parts.join('');
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('s').textContent='Ошибка: '+e.message}
})();
</script></body></html>
